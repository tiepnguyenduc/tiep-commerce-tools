query FetchReviews(
  $limit: Int!
  $offset: Int!
  $sort: [String!]
  $where: String
) {
  reviews(limit: $limit, offset: $offset, sort: $sort, where: $where) {
    total
    count
    offset
    results {
      id
      authorName
      title
      rating
      includedInStatistics
      createdAt
      state {
        id
        key
      }
      target {
        id
        ... on Product {
          key
          masterData {
            current {
              nameAllLocales {
                locale
                value
              }
            }
          }
        }
      }
    }
  }
}
